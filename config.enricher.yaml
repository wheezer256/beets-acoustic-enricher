# Add to your beets config.yaml

pluginpath:
  - /path/to/beets-acoustic-enricher     # the repository root

plugins:
  - acoustic_enricher

acoustic_enricher:
  provider: gemini            # gemini | openai | llamacpp | ollama | anthropic
  model: gemini-3.5-flash-lite

  # --- Gemini (AI Studio key or Vertex AI) ---
  api_key: ${GEMINI_API_KEY}  # or api_key_file: /run/secrets/gemini
  # use_vertex: no
  # project: ${GOOGLE_CLOUD_PROJECT}
  # location: us-central1
  thinking_budget: 0          # Gemini 2.x: 0 = no thinking tokens (cheaper); -1 = model default
  thinking_level: minimal     # Gemini 3.x: minimal|low|medium|high; '' = model default

  # --- OpenAI-compatible endpoint (LiteLLM proxy, vLLM, OpenRouter, ...) ---
  # provider: openai
  # openai_url: http://localhost:4000/v1/chat/completions
  # openai_api_key_file: /run/secrets/litellm_key   # or openai_api_key / OPENAI_API_KEY
  # model: gemini-flash        # the endpoint's model name/alias
  # reasoning_effort: disable  # '' to omit
  # structured_output: yes     # json_schema response_format; 'no' -> json_object

  # --- llama.cpp / Ollama (local, audio-capable model) ---
  # provider: llamacpp
  # llama_url: http://localhost:8080/v1/chat/completions
  # provider: ollama
  # ollama_url: http://localhost:11434/api/chat
  # timeout: 600

  # --- Anthropic (metadata-only inference, no audio) ---
  # provider: anthropic
  # model: claude-sonnet-4-6
  # anthropic_api_key: ${ANTHROPIC_API_KEY}

  # --- Sampling ---
  # clip_count: 3             # clips for tracks >= 60 s
  # clip_duration: 15         # seconds per clip

  # --- Writing ---
  # db_only: no               # yes: beets DB only, never touch audio files
  # preserve_mtime: yes       # restore file mtime after writing tags

  # --- Accounting / batch ---
  # ledger: ~/.config/beets/listen-ledger.jsonl
  # batch_dir: ''             # default <beets config dir>/listen-batches
  # batch_chunk: 1000
  # batch_max_usd: 10         # hard cap on committed batch spend
  # batch_discount: 0.5
  # prices:                   # USD per 1M tokens (list price) overrides
  #   gemini-2.5-flash: {audio: 1.00, text: 0.30, output: 2.50}

  # max_consecutive_failures: 0
