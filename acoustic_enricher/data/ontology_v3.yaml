  character:
    question: What is its aesthetic / sonic character? (0-2 terms)
    max: 2
    terms:
      hypnotic:
        parent: sound
        def: Repetitive, trance-like pull.
        aliases:
        - trance-like
        - mesmerizing
      cinematic:
        parent: sound
        def: Sounds like film music; scene-painting.
        aliases:
        - filmic
      psychedelic:
        parent: sound
        def: Mind-bending, kaleidoscopic.
        aliases:
        - trippy
      groovy:
        parent: sound
        def: Funky, bouncy feel.
        aliases:
        - funky
        - bouncy
      harsh:
        parent: sound
        def: Abrasive, grating.
        aliases:
        - abrasive
        - grating
      dissonant:
        parent: sound
        def: Clashing, atonal (also a dimension).
        aliases:
        - atonal
        - discordant
      chaotic:
        parent: sound
        def: Cacophonous, disordered.
        aliases:
        - cacophonous
      detached:
        parent: sound
        def: Cold, clinical, distant.
        aliases:
        - cold
        - clinical
      lush:
        parent: sound
        def: Rich, full, ornate sound.
        aliases:
        - ornate
        - opulent
      austere:
        parent: sound
        def: Spare, minimal, stripped.
        aliases:
        - sparse
        - minimal
      raw:
        parent: sound
        def: Unpolished, rough, immediate.
      retro:
        parent: sound
        def: Deliberately evokes an earlier era's sound (no longer an alias of nostalgic).
      sublime:
        parent: aesthetic
        def: Beauty mixed with overwhelm or fear (Burke/Kant).
      solemn:
        parent: aesthetic
        def: Ritual seriousness, liturgical weight.
      ecstatic:
        parent: aesthetic
        def: Ecstatic absorption — tarab, trance, gospel shout.
        aliases:
        - tarab
      uncanny:
        parent: aesthetic
        def: Familiar made strange.
      camp:
        parent: aesthetic
        def: Knowing excess, kitsch delight.
        aliases:
        - kitsch
      saudade:
        parent: cultural
        def: Longing for something absent or lost, loved even in its absence (Portuguese).
      duende:
        parent: cultural
        def: Raw, dark, spirit-possessed intensity (Lorca; flamenco).
      han:
        parent: cultural
        def: Collective grief and endurance (Korean).
      mono_no_aware:
        parent: cultural
        def: Gentle sadness at the passing of things (Japanese).
      yugen:
        parent: cultural
        def: Profound, mysterious depth beyond words (Japanese).
      wabi_sabi:
        parent: cultural
        def: Beauty of the imperfect and transient (Japanese).
      sehnsucht:
        parent: cultural
        def: Intense yearning for an indefinable elsewhere (German).
      hiraeth:
        parent: cultural
        def: Homesickness for a home that may never have been (Welsh).
dimensions:
  tension:
    answers: &id001
    - none
    - low
    - medium
    - high
    - very_high
    to:
    - 0
    - 0.25
    - 0.5
    - 0.75
    - 1
    def: Unease, pressure, suspense - independent of speed or loudness.
  stirring:
    answers:
    - very_settling
    - settling
    - neutral
    - stirring
    - very_stirring
    to:
    - -1
    - -0.5
    - 0
    - 0.5
    - 1
    def: How activated it makes a listener feel.
  musical_happiness:
    answers: *id001
    to:
    - 0
    - 0.25
    - 0.5
    - 0.75
    - 1
    def: How much the MUSIC (not the words) expresses happiness.
  musical_sadness:
    answers: *id001
    to:
    - 0
    - 0.25
    - 0.5
    - 0.75
    - 1
    def: How much the MUSIC (not the words) expresses sadness. Happy and sad can both be high (bittersweet).
  attention_demand:
    answers: *id001
    to:
    - 0
    - 0.25
    - 0.5
    - 0.75
    - 1
    def: How much it pulls attention to the foreground.
  complexity:
    answers: *id001
    to:
    - 0
    - 0.25
    - 0.5
    - 0.75
    - 1
    def: Harmonic and structural complexity.
  accessibility:
    answers: *id001
    to:
    - 0
    - 0.25
    - 0.5
    - 0.75
    - 1
    def: Conventional and easy to take in (high) vs challenging (low).
  rhythmic_complexity:
    answers: *id001
    to:
    - 0
    - 0.25
    - 0.5
    - 0.75
    - 1
    def: Odd meters, breaks, fragmented or shifting patterns.
  anthem:
    answers: *id001
    to:
    - 0
    - 0.25
    - 0.5
    - 0.75
    - 1
    def: Recognisable sing-along / floor-filler for a room of guests.
  lyric_intelligibility:
    answers:
    - none
    - texture
    - partial
    - foreground
    def: Words a listener follows; wordless vocals, chant, buried samples = texture.
  speech:
    answers:
    - none
    - sampled
    - spoken
    - mostly_spoken
    def: 'Speech, not singing or rapping: sampled = voice fragments used as material (collage, loops, chopped samples); spoken
      = someone actually talking (conversation, monologue, comedy, radio); mostly_spoken = the track is talk.'
  groove:
    answers:
    - none
    - straight
    - swung
    - syncopated
    - polyrhythmic
    def: Rhythmic feel.
  recording_fidelity:
    answers:
    - hi_fi
    - lo_fi
    - field
    - archival
    def: 'Recording quality as a fact: 78s, tape, field recordings.'
  purpose:
    answers:
    - song
    - soundtrack
    - comedy
    - field_recording
    - sound_art
    - ritual
    - library
    - other
    def: What the recording is, as opposed to how it sounds.
  format:
    answers:
    - studio
    - live
    - dj_mix
    - excerpt
    - skit
    - medley
    def: Live audience, continuous mix, excerpt, skit.
  musical_stance:
    answers:
    - sincere
    - ironic
    - pastiche
    - parody
    def: Whether the music means its surface (default sincere; flag only when clear).
