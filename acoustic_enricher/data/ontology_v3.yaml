version: 3
facets:
  felt:
    question: What does it make a listener feel? (induced, 0-2 terms; kept separate from A)
    max: 2
    terms:
      moved:
        parent: wonder
        def: Touched, emotionally stirred (GEMS wonder).
      awe:
        parent: wonder
        def: Vastness that dwarfs you (Cowen & Keltner awe).
      amazed:
        parent: wonder
        def: Dazzled, astonished by what you hear.
        aliases:
        - dazzled
      transcendent:
        parent: transcendence
        def: Lifted out of the everyday; spiritual feeling (GEMS).
      entranced:
        parent: transcendence
        def: Absorbed, lost in it, time disappears (Cowen entrancement).
        aliases:
        - absorbed
        - spellbound
      overwhelmed:
        parent: transcendence
        def: Too much in a good way; flooded (GEMS).
      chills:
        parent: transcendence
        def: Goosebumps / frisson moments.
        aliases:
        - frisson
        - goosebumps
      affectionate:
        parent: tenderness
        def: Warm fondness towards someone (GEMS).
      in_love:
        parent: tenderness
        def: Being in love (GEMS).
      softened:
        parent: tenderness
        def: Disarmed, softened-up (GEMS).
      desire:
        parent: tenderness
        def: Wanting, craving (Cowen & Keltner craving/sexual desire).
      sentimental:
        parent: nostalgia
        def: Fond, slightly teary remembering (GEMS).
      reminiscing:
        parent: nostalgia
        def: Carried back to a particular time or place.
      longing:
        parent: nostalgia
        def: Yearning for what is missing.
      soothed:
        parent: peacefulness
        def: Calmed down, eased (GEMS).
      at_peace:
        parent: peacefulness
        def: Settled, nothing needed.
      comforted:
        parent: peacefulness
        def: Held, consoled, safe.
        aliases:
        - consoled
      meditative:
        parent: peacefulness
        def: Quiet, focused stillness of mind (GEMS).
      empowered:
        parent: power
        def: Strong, capable, ready (GEMS strong/heroic).
        aliases:
        - strong
        - heroic
      energized:
        parent: power
        def: Charged up, awake (GEMS energetic).
        aliases:
        - stimulated
      fired_up:
        parent: power
        def: Fiery, combative energy (GEMS fiery).
      joyful:
        parent: joyful_activation
        def: Joy rising in the listener.
      urge_to_move:
        parent: joyful_activation
        def: Can't sit still; want to dance (GEMS dancing, BRECVEMA entrainment).
        aliases:
        - dancing
      amused:
        parent: joyful_activation
        def: Laughing, entertained (GEMS amused, Cowen amusing).
      released:
        parent: joyful_activation
        def: 'Catharsis: tension let go, cleansed.'
        aliases:
        - catharsis
        - relief
      unsettled:
        parent: tension
        def: Uneasy, on edge (GEMS tense/nervous).
      agitated:
        parent: tension
        def: Stirred up, impatient, irritated (GEMS agitated/irritated).
        aliases:
        - irritated
        - impatient
      dread:
        parent: tension
        def: Fear of what is coming (Cowen scary/anxious).
      sorrow:
        parent: sadness
        def: Sadness in the listener (GEMS sad/sorrowful).
      empathic_pain:
        parent: sadness
        def: Hurting on someone else's behalf (Cowen & Keltner).
      grief:
        parent: sadness
        def: Mourning, loss felt as one's own.
